version: "3.9"

# Minimal compose for testing core services only

services:
  postgres:
    build:
      context: ./database/docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ecommerce_dss
      POSTGRES_USER: dss_user
      POSTGRES_PASSWORD: dss_password_123
    ports:
      - "5433:5432"
    networks:
      - dss_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_user -d ecommerce_dss"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dss_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://dss_user:dss_password_123@postgres:5432/ecommerce_dss
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=test-secret-key
      - SECRET_KEY=test-secret
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dss_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dss_network

networks:
  dss_network:
    driver: bridge
