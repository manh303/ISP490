services:
  # Redis Cache (for performance)
  - type: redis
    name: ecommerce-dss-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # Backend API Service
  - type: web
    name: ecommerce-dss-backend
    env: python
    plan: free
    buildCommand: |
      cd backend &&
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: |
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: REDIS_URL
        fromService:
          name: ecommerce-dss-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        value: postgresql://dss_user:IkJaw42NkCz2JQw0UjdqdsTmXgcMIHC4@dpg-d454rjq4d50c73fhmen0-a.oregon-postgres.render.com/ecommerce_dss
      - key: DB_HOST
        value: dpg-d454rjq4d50c73fhmen0-a.oregon-postgres.render.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: ecommerce_dss
      - key: DB_USER
        value: dss_user
      - key: DB_PASSWORD
        value: IkJaw42NkCz2JQw0UjdqdsTmXgcMIHC4
      - key: ML_PATH
        value: /app/ml
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://isp-490.vercel.app,https://ecommerce-dss-frontend.vercel.app,http://localhost:3000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: 1
      - key: TIMEOUT
        value: 120
    healthCheckPath: /health

