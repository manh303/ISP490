services:
  # Backend API Service
  - type: web
    name: ecommerce-dss-backend
    env: python
    plan: free
    buildCommand: |
      cd backend &&
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: |
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://isp-490.vercel.app,http://localhost:3000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: 1
      - key: TIMEOUT
        value: 120
    healthCheckPath: /health


  # Frontend Service (Optional)
  - type: web
    name: ecommerce-dss-frontend
    env: static
    plan: free
    buildCommand: |
      npm ci &&
      npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ecommerce-dss-backend
          envVarKey: RENDER_EXTERNAL_URL
