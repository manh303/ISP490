services:
  # Backend API Service
  - type: web
    name: ecommerce-dss-backend
    env: python
    plan: free
    buildCommand: |
      cd backend &&
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: |
      cd backend &&
      uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: RENDER
        value: true
      # Redis Cloud Connection
      # ⚠️ SECURITY WARNING: Password is in this file!
      # For better security, set REDIS_URL in Render Dashboard → Environment tab instead
      # 
      # Your Redis URL format is CORRECT ✅
      - key: REDIS_URL
        value: redis://default:H7452ZmrxCCJDB6pxk8pqOzgj2pAq7c3@redis-15687.crce194.ap-seast-1-1.ec2.cloud.redislabs.com:15687
      - key: DATABASE_URL
        value: postgresql://dss_user:dss_password_123@localhost/ecommerce_dss
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: ecommerce_dss
      - key: DB_USER
        value: dss_user
      - key: DB_PASSWORD
        value: dss_password_123
      - key: ML_PATH
        value: /app/ml
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: https://isp-490.vercel.app,https://ecommerce-dss-frontend.vercel.app,http://localhost:3000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: 1
      - key: TIMEOUT
        value: 120
    healthCheckPath: /health

