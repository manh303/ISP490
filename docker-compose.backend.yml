version: '3.8'

services:
  # Vietnam E-commerce DSS Backend - Fixed Version
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-dss-backend-fixed
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=your-super-secret-key-change-in-production
      - PYTHONPATH=/app/backend:/app
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app/models:/app/backend/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-network

  # Standalone PostgreSQL for Backend Testing
  postgres-standalone:
    image: postgres:15-alpine
    container_name: ecommerce-dss-postgres-standalone
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ecommerce_dss
      POSTGRES_USER: dss_user
      POSTGRES_PASSWORD: dss_password_123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_standalone_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_user -d ecommerce_dss"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend-network

  # Standalone Redis for Backend Testing
  redis-standalone:
    image: redis:7-alpine
    container_name: ecommerce-dss-redis-standalone
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_standalone_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend-network

volumes:
  postgres_standalone_data:
    driver: local
  redis_standalone_data:
    driver: local

networks:
  backend-network:
    driver: bridge